quot;:&quot;p20_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy, abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), enlarged subarachnoid space&quot;,&quot;char_start&quot;:1943,&quot;char_end&quot;:2226}]},{&quot;paragraph_id&quot;:&quot;p21&quot;,&quot;paragraph_index&quot;:21,&quot;text&quot;:&quot;Radiographic findings. Hemivertebrae, rib fusions, delayed bone age&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;musculoskeletal&quot;,&quot;label&quot;:&quot;Musculoskeletal&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;vertebrae, rib fusions, delayed bone age&quot;]}],&quot;section_id&quot;:&quot;section_Suggestive_Findings&quot;,&quot;section_heading&quot;:&quot;Suggestive Findings&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p21_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Radiographic findings.&quot;,&quot;char_start&quot;:2228,&quot;char_end&quot;:2250},{&quot;sentence_id&quot;:&quot;p21_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Hemivertebrae, rib fusions, delayed bone age&quot;,&quot;char_start&quot;:2251,&quot;char_end&quot;:2295}]},{&quot;paragraph_id&quot;:&quot;p22&quot;,&quot;paragraph_index&quot;:22,&quot;text&quot;:&quot;Family history. Because ZTTK syndrome is typically caused by a de novo pathogenic variant, most probands represent a simplex case (i.e., a single occurrence in a family).&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Suggestive_Findings&quot;,&quot;section_heading&quot;:&quot;Suggestive Findings&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p22_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Family history.&quot;,&quot;char_start&quot;:2297,&quot;char_end&quot;:2312},{&quot;sentence_id&quot;:&quot;p22_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Because ZTTK syndrome is typically caused by a de novo pathogenic variant, most probands represent a simplex case (i.e., a single occurrence in a family).&quot;,&quot;char_start&quot;:2313,&quot;char_end&quot;:2467}]}]},{&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;paragraphs&quot;:[{&quot;paragraph_id&quot;:&quot;p23&quot;,&quot;paragraph_index&quot;:23,&quot;text&quot;:&quot;Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental delay and intellectual disability with a broad range of abnormalities in multiple organs. The phenotypic delineation is limited, particularly with respect to potential age-related manifestations such as neurodegeneration or clinical regression; the majority of reported individuals are children and adolescents younger than age 20 years and longitudinal data remain sparse. To date, approximately 79 individuals with a pathogenic variant in SON have been documented in the literature [ Tang et al 2023 ]. However, as of May 2025, the estimated number of individuals with a SON pathogenic variant identified was 450-500 worldwide (communication with ZTTK SON-Shine Foundation ). The following description of the phenotypic features associated with this condition is based on these reports [ Kushary et al 2021 , Dingemans et al 2022 , Tang et al 2023 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;K) syndrome is characterized by developmental delay and intellectual disability with a broad&quot;]}],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p23_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental delay and intellectual disability with a broad range of abnormalities in multiple organs.&quot;,&quot;char_start&quot;:2469,&quot;char_end&quot;:2634},{&quot;sentence_id&quot;:&quot;p23_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;The phenotypic delineation is limited, particularly with respect to potential age-related manifestations such as neurodegeneration or clinical regression; the majority of reported individuals are children and adolescents younger than age 20 years and longitudinal data remain sparse.&quot;,&quot;char_start&quot;:2635,&quot;char_end&quot;:2918},{&quot;sentence_id&quot;:&quot;p23_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;To date, approximately 79 individuals with a pathogenic variant in SON have been documented in the literature [ Tang et al 2023 ].&quot;,&quot;char_start&quot;:2919,&quot;char_end&quot;:3049},{&quot;sentence_id&quot;:&quot;p23_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;However, as of May 2025, the estimated number of individuals with a SON pathogenic variant identified was 450-500 worldwide (communication with ZTTK SON-Shine Foundation ).&quot;,&quot;char_start&quot;:3050,&quot;char_end&quot;:3222},{&quot;sentence_id&quot;:&quot;p23_s5&quot;,&quot;sentence_index&quot;:5,&quot;text&quot;:&quot;The following description of the phenotypic features associated with this condition is based on these reports [ Kushary et al 2021 , Dingemans et al 2022 , Tang et al 2023 ].&quot;,&quot;char_start&quot;:3223,&quot;char_end&quot;:3397}]}]},{&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;paragraphs&quot;:[{&quot;paragraph_id&quot;:&quot;p24&quot;,&quot;paragraph_index&quot;:24,&quot;text&quot;:&quot;Zhu-Tokita-Takenouchi-Kim Syndrome: Frequency of Select Features&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p24_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Zhu-Tokita-Takenouchi-Kim Syndrome: Frequency of Select Features&quot;,&quot;char_start&quot;:3399,&quot;char_end&quot;:3463}]},{&quot;paragraph_id&quot;:&quot;p25&quot;,&quot;paragraph_index&quot;:25,&quot;text&quot;:&quot;View in own window&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p25_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;View in own window&quot;,&quot;char_start&quot;:3465,&quot;char_end&quot;:3483}]},{&quot;paragraph_id&quot;:&quot;p26&quot;,&quot;paragraph_index&quot;:26,&quot;text&quot;:&quot;Based on Kushary et al [2021] , Dingemans et al [2022] , and Tang et al [2023]&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p26_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Based on Kushary et al [2021] , Dingemans et al [2022] , and Tang et al [2023]&quot;,&quot;char_start&quot;:3485,&quot;char_end&quot;:3563}]},{&quot;paragraph_id&quot;:&quot;p27&quot;,&quot;paragraph_index&quot;:27,&quot;text&quot;:&quot;Developmental delay and intellectual disability. Mild-to-profound developmental delay / intellectual disabilities has been reported in all individuals. Hypotonia is common. Reported delays include motor delays in rolling over, sitting up, crawling, and walking. Infants have feeding difficulties. Speech delay is common. Developmental regression has been reported in several individuals. One study reported developmental regression in three of seven individuals [ Tokita et al 2016 ]; an additional study reported developmental regression in two of 15 individuals [ Kushary et al 2021 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Developmental delay and intellectual disability. Mild-to-prof&quot;]},{&quot;key&quot;:&quot;gastrointestinal&quot;,&quot;label&quot;:&quot;Gastrointestinal&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;ling, and walking. Infants have feeding difficulties. Speech delay is common. Developme&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p27_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Developmental delay and intellectual disability.&quot;,&quot;char_start&quot;:3565,&quot;char_end&quot;:3613},{&quot;sentence_id&quot;:&quot;p27_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Mild-to-profound developmental delay / intellectual disabilities has been reported in all individuals.&quot;,&quot;char_start&quot;:3614,&quot;char_end&quot;:3716},{&quot;sentence_id&quot;:&quot;p27_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Hypotonia is common.&quot;,&quot;char_start&quot;:3717,&quot;char_end&quot;:3737},{&quot;sentence_id&quot;:&quot;p27_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;Reported delays include motor delays in rolling over, sitting up, crawling, and walking.&quot;,&quot;char_start&quot;:3738,&quot;char_end&quot;:3826},{&quot;sentence_id&quot;:&quot;p27_s5&quot;,&quot;sentence_index&quot;:5,&quot;text&quot;:&quot;Infants have feeding difficulties.&quot;,&quot;char_start&quot;:3827,&quot;char_end&quot;:3861},{&quot;sentence_id&quot;:&quot;p27_s6&quot;,&quot;sentence_index&quot;:6,&quot;text&quot;:&quot;Speech delay is common.&quot;,&quot;char_start&quot;:3862,&quot;char_end&quot;:3885},{&quot;sentence_id&quot;:&quot;p27_s7&quot;,&quot;sentence_index&quot;:7,&quot;text&quot;:&quot;Developmental regression has been reported in several individuals.&quot;,&quot;char_start&quot;:3886,&quot;char_end&quot;:3952},{&quot;sentence_id&quot;:&quot;p27_s8&quot;,&quot;sentence_index&quot;:8,&quot;text&quot;:&quot;One study reported developmental regression in three of seven individuals [ Tokita et al 2016 ]; an additional study reported developmental regression in two of 15 individuals [ Kushary et al 2021 ].&quot;,&quot;char_start&quot;:3953,&quot;char_end&quot;:4152}]},{&quot;paragraph_id&quot;:&quot;p28&quot;,&quot;paragraph_index&quot;:28,&quot;text&quot;:&quot;Brain malformations include ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy (often reduced volume of periventricular white matter), abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), and enlarged subarachnoid space.&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Brain malformations include ventriculomegaly, periven&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p28_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Brain malformations include ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy (often reduced volume of periventricular white matter), abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), and enlarged subarachnoid space.&quot;,&quot;char_start&quot;:4154,&quot;char_end&quot;:4525}]},{&quot;paragraph_id&quot;:&quot;p29&quot;,&quot;paragraph_index&quot;:29,&quot;text&quot;:&quot;Neurobehavioral/psychiatric manifestations. Behavioral problems include sleep disturbances and autism spectrum disorder [ Dingemans et al 2022 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p29_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Neurobehavioral/psychiatric manifestations.&quot;,&quot;char_start&quot;:4527,&quot;char_end&quot;:4570},{&quot;sentence_id&quot;:&quot;p29_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Behavioral problems include sleep disturbances and autism spectrum disorder [ Dingemans et al 2022 ].&quot;,&quot;char_start&quot;:4571,&quot;char_end&quot;:4672}]},{&quot;paragraph_id&quot;:&quot;p30&quot;,&quot;paragraph_index&quot;:30,&quot;text&quot;:&quot;Seizures are common with age of onset ranging from infancy to six years [ Zhu et al 2015 , Kim et al 2016b , Tokita et al 2016 , Kushary et al 2021 ]. Complex partial and complex febrile seizures have been reported. Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals. Status epilepticus was reported in 16% of individuals [ Kushary et al 2021 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;zures have been reported. Other seizure types described include generalized tonic-cloni&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p30_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Seizures are common with age of onset ranging from infancy to six years [ Zhu et al 2015 , Kim et al 2016b , Tokita et al 2016 , Kushary et al 2021 ].&quot;,&quot;char_start&quot;:4674,&quot;char_end&quot;:4824},{&quot;sentence_id&quot;:&quot;p30_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Complex partial and complex febrile seizures have been reported.&quot;,&quot;char_start&quot;:4825,&quot;char_end&quot;:4889},{&quot;sentence_id&quot;:&quot;p30_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals.&quot;,&quot;char_start&quot;:4890,&quot;char_end&quot;:5039},{&quot;sentence_id&quot;:&quot;p30_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;Status epilepticus was reported in 16% of individuals [ Kushary et al 2021 ].&quot;,&quot;char_start&quot;:5040,&quot;char_end&quot;:5117}]},{&quot;paragraph_id&quot;:&quot;p31&quot;,&quot;paragraph_index&quot;:31,&quot;text&quot;:&quot;Movement disorder. Dystonia and tremor have been reported, although these features have not been fully documented. Cervical dystonia and dystonic posturing of limbs have been reported in one adult with childhood onset; this worsened over time, contributing to functional impairment. The same individual had an intention tremor affecting the limbs [ Indelicato et al 2022 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Movement disorder. Dystonia and tremor have been reporte&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p31_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Movement disorder.&quot;,&quot;char_start&quot;:5119,&quot;char_end&quot;:5137},{&quot;sentence_id&quot;:&quot;p31_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Dystonia and tremor have been reported, although these features have not been fully documented.&quot;,&quot;char_start&quot;:5138,&quot;char_end&quot;:5233},{&quot;sentence_id&quot;:&quot;p31_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Cervical dystonia and dystonic posturing of limbs have been reported in one adult with childhood onset; this worsened over time, contributing to functional impairment.&quot;,&quot;char_start&quot;:5234,&quot;char_end&quot;:5401},{&quot;sentence_id&quot;:&quot;p31_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;The same individual had an intention tremor affecting the limbs [ Indelicato et al 2022 ].&quot;,&quot;char_start&quot;:5402,&quot;char_end&quot;:5492}]},{&quot;paragraph_id&quot;:&quot;p32&quot;,&quot;paragraph_index&quot;:32,&quot;text&quot;:&quot;Craniofacial features. Some combination of characteristic facial features have been reported in approximately 95% of individuals including facial asymmetry (30%), prominent forehead, horizontal eyebrows (32%), ptosis, downslanted palpebral fissures (52%), epicanthal folds (20%), deep-set eyes (27%), midface retrusion (34%), depressed or other abnormality of the nasal bridge (56%), low-set ears (53%), posteriorly rotated ears (15%), short and/or smooth philtrum (54%), thin vermilion of the upper lip (13%), bifid uvula, and high-arched palate.&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;craniofacial&quot;,&quot;label&quot;:&quot;Craniofacial&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Craniofacial features. Some combination of characteristic fa&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p32_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Craniofacial features.&quot;,&quot;char_start&quot;:5494,&quot;char_end&quot;:5516},{&quot;sentence_id&quot;:&quot;p32_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Some combination of characteristic facial features have been reported in approximately 95% of individuals including facial asymmetry (30%), prominent forehead, horizontal eyebrows (32%), ptosis, downslanted palpebral fissures (52%), epicanthal folds (20%), deep-set eyes (27%), midface retrusion (34%), depressed or other abnormality of the nasal bridge (56%), low-set ears (53%), posteriorly rotated ears (15%), short and/or smooth philtrum (54%), thin vermilion of the upper lip (13%), bifid uvula, and high-arched palate.&quot;,&quot;char_start&quot;:5517,&quot;char_end&quot;:6041}]},{&quot;paragraph_id&quot;:&quot;p33&quot;,&quot;paragraph_index&quot;:33,&quot;text&quot;:&quot;Craniosynostosis has been reported in six individuals (10%) [ Kim et al 2016b , Kushary et al 2021 , Halliday et al 2022 ], involving the metopic, sagittal, and coronal sutures.&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p33_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Craniosynostosis has been reported in six individuals (10%) [ Kim et al 2016b , Kushary et al 2021 , Halliday et al 2022 ], involving the metopic, sagittal, and coronal sutures.&quot;,&quot;char_start&quot;:6043,&quot;char_end&quot;:6220}]},{&quot;paragraph_id&quot;:&quot;p34&quot;,&quot;paragraph_index&quot;:34,&quot;text&quot;:&quot;Skeletal manifestations. Scoliosis and kyphosis have been reported (combined estimated frequency is 6%) [ Kim et al 2016b , Tokita et al 2016 ]. Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported. Hyperextensibility of the interphalangeal joints of the hand and elbow joints has been described [ Kushary et al 2021 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;musculoskeletal&quot;,&quot;label&quot;:&quot;Musculoskeletal&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Skeletal manifestations. Scoliosis and kyphosis have bee&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p34_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Skeletal manifestations.&quot;,&quot;char_start&quot;:6222,&quot;char_end&quot;:6246},{&quot;sentence_id&quot;:&quot;p34_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Scoliosis and kyphosis have been reported (combined estimated frequency is 6%) [ Kim et al 2016b , Tokita et al 2016 ].&quot;,&quot;char_start&quot;:6247,&quot;char_end&quot;:6366},{&quot;sentence_id&quot;:&quot;p34_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported.&quot;,&quot;char_start&quot;:6367,&quot;char_end&quot;:6540},{&quot;sentence_id&quot;:&quot;p34_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;Hyperextensibility of the interphalangeal joints of the hand and elbow joints has been described [ Kushary et al 2021 ].&quot;,&quot;char_start&quot;:6541,&quot;char_end&quot;:6661}]},{&quot;paragraph_id&quot;:&quot;p35&quot;,&quot;paragraph_index&quot;:35,&quot;text&quot;:&quot;Ophthalmologic involvement. More than half (58%) of the individuals who reported vision abnormalities presented with strabismus [ Kushary et al 2021 ]. Hypermetropia with childhood onset (20%) and cortical visual impairment (11%) have been reported.&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;ophthalmologic&quot;,&quot;label&quot;:&quot;Ophthalmologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;of the individuals who reported vision abnormalities presented with strabismus [ Kusha&quot;]}],&quot ncy was rep&quot;]},{&quot;key&quot;:&quot;musculoskeletal&quot;,&quot;label&quot;:&quot;Musculoskeletal&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;Growth deficiency. Intrauterine growth restriction was&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p36_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Growth deficiency.&quot;,&quot;char_start&quot;:6914,&quot;char_end&quot;:6932},{&quot;sentence_id&quot;:&quot;p36_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Intrauterine growth restriction was reported in 12/36 infants (33%) [ Dingemans et al 2022 ].&quot;,&quot;char_start&quot;:6933,&quot;char_end&quot;:7026},{&quot;sentence_id&quot;:&quot;p36_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Microcephaly was reported in 11/40 examined individuals [ Dingemans et al 2022 ].&quot;,&quot;char_start&quot;:7027,&quot;char_end&quot;:7108},{&quot;sentence_id&quot;:&quot;p36_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;To date, it is unclear how many infants had congenital microcephaly.&quot;,&quot;char_start&quot;:7109,&quot;char_end&quot;:7177},{&quot;sentence_id&quot;:&quot;p36_s5&quot;,&quot;sentence_index&quot;:5,&quot;text&quot;:&quot;Weight below the third centile was reported in 14/25 individuals.&quot;,&quot;char_start&quot;:7178,&quot;char_end&quot;:7243},{&quot;sentence_id&quot;:&quot;p36_s6&quot;,&quot;sentence_index&quot;:6,&quot;text&quot;:&quot;Short stature (below the third centile) was reported in 26/48 individuals.&quot;,&quot;char_start&quot;:7244,&quot;char_end&quot;:7318},{&quot;sentence_id&quot;:&quot;p36_s7&quot;,&quot;sentence_index&quot;:7,&quot;text&quot;:&quot;It is likely that postnatal growth failure is exacerbated by feeding difficulties.&quot;,&quot;char_start&quot;:7319,&quot;char_end&quot;:7401},{&quot;sentence_id&quot;:&quot;p36_s8&quot;,& nce_index&quot;:2,&quot;text&quot;:&quot;Ventricular septal defect (VSD), atrial septal defect (ASD), and dysplastic aortic valve have been reported [ Kim et al 2016b , Tokita et al 2016 ].&quot;,&quot;char_start&quot;:8131,&quot;char_end&quot;:8279},{&quot;sentence_id&quot;:&quot;p39_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Dingemans et al [2022] examined additional individuals and reported that 15/46 (33%) individuals had a heart defect, especially ASD (6/35, 17%) and VSD (4/46, 9%).&quot;,&quot;char_start&quot;:8280,&quot;char_end&quot;:8443}]},{&quot;paragraph_id&quot;:&quot;p40&quot;,&quot;paragraph_index&quot;:40,&quot;text&quot;:&quot;Immunologic manifestations. Immunoglobulin (Ig) deficiency, particularly IgA and IgG deficiency, has been reported in 15/46 assessed individuals [ Dingemans et al 2022 ]. Reported recurrent infections include respiratory tract, urinary tract, and ear.&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;auditory&quot;,&quot;label&quot;:&quot;Auditory&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;atory tract, urinary tract, and ear.&quot;]}],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p40_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Immunologic manifestations.&quot;,&quot;char_start&quot;:8445,&quot;char_end&quot;:8472},{&quot;sentence_id&quot;:&quot;p40_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Immunoglobulin (Ig) deficiency, particularly IgA and IgG deficiency, has been reported in 15/46 assessed individuals [ Dingemans et al 2022 ].&quot;,&quot;char_start&quot;:8473,&quot;char_end&quot;:8615},{&quot;sentence_id&quot;:&quot;p40_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Reported recurrent infections include respiratory tract, urinary tract, and ear.&quot;,&quot;char_start&quot;:8616,&quot;char_end&quot;:869 uot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p42_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Hearing impairment.&quot;,&quot;char_start&quot;:8977,&quot;char_end&quot;:8996},{&quot;sentence_id&quot;:&quot;p42_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Hearing loss was reported in 3/7 individuals in one report [ Halliday et al 2022 ]; hearing impairment was described as conductive in one individual.&quot;,&quot;char_start&quot;:8997,&quot;char_end&quot;:9146},{&quot;sentence_id&quot;:&quot;p42_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Age of onset of hearing loss is not known.&quot;,&quot;char_start&quot;:9147,&quot;char_end&quot;:9189},{&quot;sentence_id&quot;:&quot;p42_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;The ages of these three individuals at their last examination were 17 years, four years, and five years eight months.&quot;,&quot;char_start&quot;:9190,&quot;char_end&quot;:9307}]},{&quot;paragraph_id&quot;:&quot;p43&quot;,&quot;paragraph_index&quot;:43,&quot;text&quot;:&quot;Other. Recurrent hemiplegic migraine was reported in one individual [ Langford et al 2023 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p43_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Other.&quot;,&quot;char_start&quot;:9309,&quot;char_end&quot;:9315},{&quot;sentence_id&quot;:&quot;p43_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Recurrent hemiplegic migraine was reported in one individual [ Langford et al 2023 ].&quot;,&quot;char_start&quot;:9316,&quot;char_end&quot;:9401}]},{&quot;paragraph_id&quot;:&quot;p44&quot;,&quot;paragraph_index&quot;:44,&quot;text&quot;:&quot;Prognosis. Based on current data, life span is not limited by this condition, as several adults have been reported, including one individual alive at age 50 years [ Dingemans et al 2022 ]. However, three affected individuals died in childhood (communication with ZTTK SON-Shine Foundation ), although the exact causes of death were not documented. Considerable variability in clinical course has been observed, with preliminary reports indicating that some individuals may experience progression or regression of neurologic and behavioral features, whereas others do not. The underlying basis of this variability remains uncertain and may reflect differences in genetic background, environmental or nutritional influences, or other modifying factors rather than allelic heterogeneity alone. This represents a significant knowledge gap and underscores that a molecular diagnosis of ZTTK syndrome does not inherently imply a uniformly severe or lethal prognosis. Longitudinal studies across broader age ranges will be essential to clarify the natural history of the disorder.&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Table_2&quot;,&quot;section_heading&quot;:&quot;Table 2.&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p44_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Prognosis.&quot;,&quot;char_start&quot;:9403,&quot;char_end&quot;:9413},{&quot;sentence_id&quot;:&quot;p44_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Based on current data, life span is not limited by this condition, as several adults have been reported, including one individual alive at age 50 years [ Dingemans et al 2022 ].&quot;,&quot;char_start&quot;:9414,&quot;char_end&quot;:9591},{&quot;sentence_id&quot;:&quot;p44_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;However, three affected individuals died in childhood (communication with ZTTK SON-Shine Foundation ), although the exact causes of death were not documented.&quot;,&quot;char_start&quot;:9592,&quot;char_end&quot;:9750},{&quot;sentence_id&quot;:&quot;p44_s4&quot;,&quot;sentence_index&quot quot;paragraph_char_end&quot;:null,&quot;sentence_char_start&quot;:null,&quot;sentence_char_end&quot;:null,&quot;sentence_text&quot;:&quot;Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals.&quot;,&quot;paragraph_text&quot;:&quot;Clinical Description Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental delay and intellectual disability with a broad range of abnormalities in multiple organs. The phenotypic delineation is limited, particularly with respect to potential age-related manifestations such as neurodegeneration or clinical regression; the majority of reported individuals are children and adolescents younger than age 20 years and longitudinal data remain sparse. To date, approximately 79 individuals with a pathogenic variant in SON have been documented in the literature [ Tang et al 2023 ]. However, as of May 2025, the estimated number of individuals with a SON pathogenic variant identified was 450-500 worldwide (communication with ZTTK SON-Shine Foundation ). The following description of the phenotypic features associated with this condition is based on these reports [ Kushary et al 2021 , Dingemans et al 2022 , Tang et al 2023 ]. Table 2. Zhu-Tokita-Takenouchi-Kim Syndrome: Frequency of Select Features View in own window Based on Kushary et al [2021] , Dingemans et al [2022] , and Tang et al [2023] Developmental delay and intellectual disability. Mild-to-profound developmental delay / intellectual disabilities has been reported in all individuals. Hypotonia is common. Reported delays include motor delays in rolling over, sitting up, crawling, and walking. Infants have feeding difficulties. Speech delay is common. Developmental regression has been reported in several individuals. One study reported developmental regression in three of seven individuals [ Tokita et al 2016 ]; an additional study reported developmental regression in two of 15 individuals [ Kushary et al 2021 ]. Brain malformations include ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy (often reduced volume of periventricular white matter), abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), and enlarged subarachnoid space. Neurobehavioral/psychiatric manifestations. Behavioral problems include sleep disturbances and autism spectrum disorder [ Dingemans et al 2022 ]. Seizures are common with age of onset ranging from infancy to six years [ Zhu et al 2015 , Kim et al 2016b , Tokita et al 2016 , Kushary et al 2021 ]. Complex partial and complex febrile seizures have been reported. Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals. Status epilepticus was reported in 16% of individuals [ Kushary et al 2021 ]. Movement disorder. Dystonia and tremor have been reported, although these features have not been fully documented. Cervical dystonia and dystonic posturing of limbs have been reported in one adult with childhood onset; this worsened over time, contributing to functional impairment. The same individual had an intention tremor affecting the limbs [ Indelicato et al 2022 ]. Craniofacial features. Some combination of characteristic facial features have been reported in approximately 95% of individuals including facial asymmetry (30%), prominent forehead, horizontal eyebrows (32%), ptosis, downslanted palpebral fissures (52%), epicanthal folds (20%), deep-set eyes (27%), midface retrusion (34%), depressed or other abnormality of the nasal bridge (56%), low-set ears (53%), posteriorly rotated ears (15%), short and/or smooth philtrum (54%), thin vermilion of the upper lip (13%), bifid uvula, and high-arched palate. Craniosynostosis has been reported in six individuals (10%) [ Kim et al 2016b , Kushary et al 2021 , Halliday et al 2022 ], involving the metopic, sagittal, and coronal sutures. Skeletal manifestations. Scoliosis and kyphosis have been reported (combined estimated frequency is 6%) [ Kim et al 2016b , Tokita et al 2016 ]. Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported. Hyperextensibility of the interphalangeal joints of the hand and elbow joints has been described [ Kushary et al 2021 ]. Ophthalmologic involvement. More than half (58%) of the individuals who reported vision abnormalities presented with strabismus [ Kushary et al 2021 ]. Hypermetropia with childhood onset (20%) and cortical visual impairment (11%) have been reported. Growth deficiency. Intrauterine growth restriction was reported in 12/36 infants (33%) [ Dingemans et al 2022 ]. Microcephaly was reported in 11/40 examined individuals [ Dingemans et al 2022 ]. To date, it is unclear how many infants had congenital microcephaly. Weight below the third centile was reported in 14/25 individuals. Short stature (below the third centile) was reported in 26/48 individuals. It is likely that postnatal growth failure is exacerbated by feeding difficulties. Growth hormone deficiency was reported in 6/43 individuals [ Dingemans et al 2022 ] and also identified in two additional individuals [ Yang et al 2019 , Yang &amp; Yang 2020 ]. The final adult height has not been documented, as many affected individuals are currently in infancy or childhood. Genitourinary/kidney manifestations. Chordee, undescended testes, inguinal hernia, shawl scrotum, and hypoplastic labia major are reported. Kidney abnormalities include single kidney, horseshoe kidney, kidney dysplasia, and polycystic kidneys [ Kim et al 2019 ]. Hematologic findings. Thrombocytopenia and deep vein thrombosis have been reported [ Kim et al 2016b , Tokita et al 2016 , Pietrobattista et al 2023 ]. Heart abnormalities. Ventricular septal defect (VSD), atrial septal defect (ASD), and dysplastic aortic valve have been reported [ Kim et al 2016b , Tokita et al 2016 ]. Dingemans et al [2022] examined additional individuals and reported that 15/46 (33%) individuals had a heart defect, especially ASD (6/35, 17%) and VSD (4/46, 9%). Immunologic manifestations. Immunoglobulin (Ig) deficiency, particularly IgA and IgG deficiency, has been reported in 15/46 assessed individuals [ Dingemans et al 2022 ]. Reported recurrent infections include respiratory tract, urinary tract, and ear. Gastrointestinal manifestations include malrotation of the gut, gastroesophageal reflux disease, diarrhea, constipation, and gallbladder agenesis; chronic liver cirrhosis with micro- and macronodularity and spongiosis hepatitis have been reported [ Pietrobattista et al 2023 ]. Hearing impairment. Hearing loss was reported in 3/7 individuals in one report [ Halliday et al 2022 ]; hearing impairment was described as conductive in one individual. Age of onset of hearing loss is not known. The ages of these three individuals at their last examination were 17 years, four years, and five years eight months. Other. Recurrent hemiplegic migraine was reported in one individual [ Langford et al 2023 ]. Prognosis. Based on current data, life span is not limited by this condition, as several adults have been reported, including one individual alive at age 50 years [ Dingemans et al 2022 ]. However, three affected individuals died in childhood (communication with ZTTK SON-Shine Foundation ), although the exact causes of death were not documented. Considerable variability in clinical course has been observed, with preliminary reports indicating that some individuals may experience progression or regression of neurologic and behavioral features, whereas others do not. The underlying basis of this variability remains uncertain and may reflect differences in genetic background, environmental or nutritional influences, or other modifying factors rather than allelic heterogeneity alone. This represents a significant knowledge gap and underscores that a molecular diagnosis of ZTTK syndrome does not inherently imply a uniformly severe or lethal prognosis. Longitudinal studies across broader age ranges will be essential to clarify the natural history of the disorder.&quot;,&quot;matched_phrase&quot;:&quot;clonic seizures&quot;,&quot;match_span_text&quot;:null,&quot;frequency_raw&quot;:null,&quot;onset_raw&quot;:null,&quot;progression_raw&quot;:null,&quot;treatment_response_raw&quot;:null,&quot;spans&quot;:[],&quot;failed_checks&quot;:[],&quot;flagged_checks&quot;:[],&quot;checks&quot;:[{&quot;name&quot;:&quot;source_span&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No sentence span recorded.&quot;},{&quot;name&quot;:&quot;phenotype_presence&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Matched \&quot;clonic seizures\&quot; in source sentence.&quot;,&quot;matched_phrase&quot;:&quot;clonic seizures&quot;,&quot;evidence_source&quot;:&quot;stored&quot;},{&quot;name&quot;:&quot;frequency_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No frequency claimed.&quot;},{&quot;name&quot;:&quot;onset_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset claimed.&quot;},{&quot;name&quot;:&quot;progression_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No progression claimed.&quot;},{&quot;name&quot;:&quot;treatment_response_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No treatment response claimed.&quot;},{&quot;name&quot;:&quot;clause_attachment&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset attachment to verify.&quot;},{&quot;name&quot;:&quot;alias_shadow&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;No longer enclosing phenotype phrase detected.&quot;},{&quot;name&quot;:&quot;disease_subtype_l ce_url&quot;:&quot;https://www.ncbi.nlm.nih.gov/books/NBK618356/&quot;,&quot;hpo_id&quot;:&quot;HP:0010818&quot;,&quot;hpo_label&quot;:&quot;Generalized tonic seizure&quot;,&quot;status&quot;:&quot;present&quot;,&quot;verdict&quot;:&quot;VERIFIED&quot;,&quot;auto_accept_eligible&quot;:false,&quot;auto_accept_reasons&quot;:[&quot;hpo_mapping_not_high&quot;,&quot;source_span:skip&quot;],&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:null,&quot;section_heading&quot;:null,&quot;paragraph_id&quot;:null,&quot;sentence_id&quot;:null,&quot;paragraph_char_start&quot;:null,&quot;paragraph_char_end&quot;:null,&quot;sentence_char_start&quot;:null,&quot;sentence_char_end&quot;:null,&quot;sentence_text&quot;:&quot;Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals.&quot;,&quot;paragraph_text&quot;:&quot;Clinical Description Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental delay and intellectual disability with a broad range of abnormalities in multiple organs. The phenotypic delineation is limited, particularly with respect to potential age-related manifestations such as neurodegeneration or clinical regression; the majority of reported individuals are children and adolescents younger than age 20 years and longitudinal data remain sparse. To date, approximately 79 individuals with a pathogenic variant in SON have been documented in the literature [ Tang et al 2023 ]. However, as of May 2025, the estimated number of individuals with a SON pathogenic variant identified was 450-500 worldwide (communication with ZTTK SON-Shine Foundation ). The following description of the phenotypic features associated with this condition is based on these reports [ Kushary et al 2021 , Dingemans et al 2022 , Tang et al 2023 ]. Table 2. Zhu-Tokita-Takenouchi-Kim Syndrome: Frequency of Select Features View in own window Based on Kushary et al [2021] , Dingemans et al [2022] , and Tang et al [2023] Developmental delay and intellectual disability. Mild-to-profound developmental delay / intellectual disabilities has been reported in all individuals. Hypotonia is common. Reported delays include motor delays in rolling over, sitting up, crawling, and walking. Infants have feeding difficulties. Speech delay is common. Developmental regression has been reported in several individuals. One study reported developmental regression in three of seven individuals [ Tokita et al 2016 ]; an additional study reported developmental regression in two of 15 individuals [ Kushary et al 2021 ]. Brain malformations include ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy (often reduced volume of periventricular white matter), abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), and enlarged subarachnoid space. Neurobehavioral/psychiatric manifestations. Behavioral problems include sleep disturbances and autism spectrum disorder [ Dingemans et al 2022 ]. Seizures are common with age of onset ranging from infancy to six years [ Zhu et al 2015 , Kim et al 2016b , Tokita et al 2016 , Kushary et al 2021 ]. Complex partial and complex febrile seizures have been reported. Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals. Status epilepticus was reported in 16% of individuals [ Kushary et al 2021 ]. Movement disorder. Dystonia and tremor have been reported, although these features have not been fully documented. Cervical dystonia and dystonic posturing of limbs have been reported in one adult with childhood onset; this worsened over time, contributing to functional impairment. The same individual had an intention tremor affecting the limbs [ Indelicato et al 2022 ]. Craniofacial features. Some combination of characteristic facial features have been reported in approximately 95% of individuals including facial asymmetry (30%), prominent forehead, horizontal eyebrows (32%), ptosis, downslanted palpebral fissures (52%), epicanthal folds (20%), deep-set eyes (27%), midface retrusion (34%), depressed or other abnormality of the nasal bridge (56%), low-set ears (53%), posteriorly rotated ears (15%), short and/or smooth philtrum (54%), thin vermilion of the upper lip (13%), bifid uvula, and high-arched palate. Craniosynostosis has been reported in six individuals (10%) [ Kim et al 2016b , Kushary et al 2021 , Halliday et al 2022 ], involving the metopic, sagittal, and coronal sutures. Skeletal manifestations. Scoliosis and kyphosis have been reported (combined estimated frequency is 6%) [ Kim et al 2016b , Tokita et al 2016 ]. Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported. Hyperextensibility of the interphalangeal joints of the hand and elbow joints has been described [ Kushary et al 2021 ]. Ophthalmologic involvement. More than half (58%) of the individuals who reported vision abnormalities presented with strabismus [ Kushary et al 2021 ]. Hypermetropia with childhood onset (20%) and cortical visual impairment (11%) have been reported. Growth deficiency. Intrauterine growth restriction was reported in 12/36 infants (33%) [ Dingemans et al 2022 ]. Microcephaly was reported in 11/40 examined individuals [ Dingemans et al 2022 ]. To date, it is unclear how many infants had congenital microcephaly. Weight below the third centile was reported in 14/25 individuals. Short stature (below the third centile) was reported in 26/48 individuals. It is likely that postnatal growth failure is exacerbated by feeding difficulties. Growth hormone deficiency was reported in 6/43 individuals [ Dingemans et al 2022 ] and also identified in two additional individuals [ Yang et al 2019 , Yang &amp; Yang 2020 ]. The final adult height has not been documented, as many affected individuals are currently in infancy or childhood. Genitourinary/kidney manifestations. Chordee, undescended testes, inguinal hernia, shawl scrotum, and hypoplastic labia major are reported. Kidney abnormalities include single kidney, horseshoe kidney, kidney dysplasia, and polycystic kidneys [ Kim et al 2019 ]. Hematologic findings. Thrombocytopenia and deep vein thrombosis have been reported [ Kim et al 2016b , Tokita et al 2016 , Pietrobattista et al 2023 ]. Heart abnormalities. Ventricular septal defect (VSD), atrial septal defect (ASD), and dysplastic aortic valve have been reported [ Kim et al 2016b , Tokita et al 2016 ]. Dingemans et al [2022] examined additional individuals and reported that 15/46 (33%) individuals had a heart defect, especially ASD (6/35, 17%) and VSD (4/46, 9%). Immunologic manifestations. Immunoglobulin (Ig) deficiency, particularly IgA and IgG deficiency, has been reported in 15/46 assessed individuals [ Dingemans et al 2022 ]. Reported recurrent infections include respiratory tract, urinary tract, and ear. Gastrointestinal manifestations include malrotation of the gut, gastroesophageal reflux disease, diarrhea, constipation, and gallbladder agenesis; chronic liver cirrhosis with micro- and macronodularity and spongiosis hepatitis have been reported [ Pietrobattista et al 2023 ]. Hearing impairment. Hearing loss was reported in 3/7 individuals in one report [ Halliday et al 2022 ]; hearing impairment was described as conductive in one individual. Age of onset of hearing loss is not known. The ages of these three individuals at their last examination were 17 years, four years, and five years eight months. Other. Recurrent hemiplegic migraine was reported in one individual [ Langford et al 2023 ]. Prognosis. Based on current data, life span is not limited by this condition, as several adults have been reported, including one individual alive at age 50 years [ Dingemans et al 2022 ]. However, three affected individuals died in childhood (communication with ZTTK SON-Shine Foundation ), although the exact causes of death were not documented. Considerable variability in clinical course has been observed, with preliminary reports indicating that some individuals may experience progression or regression of neurologic and behavioral features, whereas others do not. The underlying basis of this variability remains uncertain and may reflect differences in genetic background, environmental or nutritional influences, or other modifying factors rather than allelic heterogeneity alone. This represents a significant knowledge gap and underscores that a molecular diagnosis of ZTTK syndrome does not inherently imply a uniformly severe or lethal prognosis. Longitudinal studies across broader age ranges will be essential to clarify the natural history of the disorder.&quot;,&quot;matched_phrase&quot;:&quot;generalized tonic-clonic seizure&quot;,&quot;match_span_text&quot;:null,&quot;frequency_raw&quot;:null,&quot;onset_raw&quot;:null,&quot;progression_raw&quot;:null,&quot;treatment_response_raw&quot;:null,&quot;spans&quot;:[],&quot;failed_checks&quot;:[],&quot;flagged_checks&quot;:[],&quot;checks&quot;:[{&quot;name&quot;:&quot;source_span&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No sentence span recorded.&quot;},{&quot;name&quot;:&quot;phenotype_presence&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Matched \&quot;generalized tonic-clonic seizure\&quot; in source sentence.&quot;,&quot;matched_phrase&quot;:&quot;generalized tonic-clonic seizure&quot;,&quot;evidence_source&quot;:&quot;stored&quot;},{&quot;name&quot;:&quot;frequency_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No frequency claimed.&quot;},{&quot;name&quot;:&quot;onset_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset claimed.&quot;},{&quot;n auto_accept_eligible&quot;:false,&quot;auto_accept_reasons&quot;:[&quot;source_span:skip&quot;,&quot;phenotype_presence:fail&quot;,&quot;contains_failed_check&quot;],&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:null,&quot;section_heading&quot;:null,&quot;paragraph_id&quot;:null,&quot;sentence_id&quot;:null,&quot;paragraph_char_start&quot;:null,&quot;paragraph_char_end&quot;:null,&quot;sentence_char_start&quot;:null,&quot;sentence_char_end&quot;:null,&quot;sentence_text&quot;:&quot;Suggestive Findings Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome should be considered in individuals with the following clinical and imaging findings [ Kim et al 2016b , Tokita et al 2016 , Dingemans et al 2022 ] and family history.&quot;,&quot;paragraph_text&quot;:&quot;Suggestive Findings Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome should be considered in individuals with the following clinical and imaging findings [ Kim et al 2016b , Tokita et al 2016 , Dingemans et al 2022 ] and family history. Clinical findings Mild-to-profound developmental delay with occasional neurodevelopmental regression Moderate-to-severe intellectual disability Generalized hypotonia of infancy and infantile feeding difficulties Skeletal anomalies: scoliosis, kyphosis, thumb agenesis, syndactyly, contractures of large or small joints, and/or generalized joint hypermobility Ophthalmologic involvement: strabismus, hypermetropia, cortical vision impairment Craniofacial features: facial asymmetry, prominent forehead, horizontal eyebrows, ptosis, downslanted palpebral fissures, epicanthal folds, deep-set eyes, depressed nasal bridge, low-set ears, short and smooth philtrum, thin vermilion of the upper lip, bifid uvula, and high-arched palate; craniosynostosis also reported (See Figures 1 , 2 , and 3 .) Poor weight gain, short stature, and microcephaly Neurobehavioral/psychiatric manifestations: sleep disturbance, autism spectrum disorder, emotional dysregulation, and aggression Epilepsy: complex partial and complex febrile seizures Movement disorder: dystonia, tremors Genitourinary and kidney manifestations: chordee, single kidney, horseshoe kidney, kidney dysplasia, polycystic kidneys, undescended testes, inguinal hernia, and shawl scrotum Thrombocytopenia and deep venous thrombosis Structural cardiac anomalies: ventricular septal defect, atrial septal defect, and dysplastic aortic valve Immunodeficiency: Immunoglobulin (Ig) A deficiency, IgG deficiency, and recurrent infection Gastrointestinal manifestations: malrotation of the gut, gastroesophageal reflux disease, diarrhea, constipation, and gallbladder agenesis Endocrinologic abnormalities: growth hormone deficiency Imaging findings Brain MRI findings. Ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy, abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), enlarged subarachnoid space Radiographic findings. Hemivertebrae, rib fusions, delayed bone age Family history. Because ZTTK syndrome is typically caused by a de novo pathogenic variant, most probands represent a simplex case (i.e., a single occurrence in a family).&quot;,&quot;matched_phrase&quot;:&quot;inability to walk&quot;,&quot;match_span_text&quot;:null,&quot;frequency_raw&quot;:null,&quot;onset_raw&quot;:null,&quot;progression_raw&quot;:null,&quot;treatment_response_raw&quot;:null,&quot;spans&quot;:[],&quot;failed_checks&quot;:[&quot;phenotype_presence&quot;],&quot;flagged_checks&quot;:[],&quot;checks&quot;:[{&quot;name&quot;:&quot;source_span&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No sentence span recorded.&quot;},{&quot;name&quot;:&quot;phenotype_presence&quot;,&quot;status&quot;:&quot;fail&quot;,&quot;detail&quot;:&quot;Source sentence not found in cached chapter text.&quot;},{&quot;name&quot;:&quot;frequency_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot ew_id&quot;:&quot;review-85-hp-0034392-present&quot;,&quot;review_href&quot;:&quot;/Users/ahmedelmorshedy/Genovy-phenotype-enrichment-20260316-0914/output/genereviews-pipeline-latest5-settled-20260330/stage7_verify_medgemma/review_pages/Zhu_Tokita_Takenouchi_Kim_Syndrome_review.html#review-85-hp-0034392-present&quot;,&quot;hosted_review_href&quot;:&quot;/audit/genereviews?chapter=zhu_tokita_takenouchi_kim_syndrome#review-85-hp-0034392-present&quot;,&quot;chapter_key&quot;:&quot;zhu_tokita_takenouchi_kim_syndrome&quot;,&quot;nbk_id&quot;:&quot;NBK618356&quot;,&quot;chapter_title&quot;:&quot;Zhu-Tokita-Takenouchi-Kim Syndrome - GeneReviews® - NCBI Bookshelf&quot;,&quot;source_url&quot;:&quot;https://www.ncbi.nlm.nih.gov/books/NBK618356/&quot;,&quot;hpo_id&quot;:&quot;HP:0034392&quot;,&quot;hpo_label&quot;:&quot;Joint contracture&quot;,&quot;status&quot;:&quot;present&quot;,&quot;verdict&quot;:&quot;VERIFIED&quot;,&quot;auto_accept_eligible&quot;:false,&quot;auto_accept_reasons&quot;:[&quot;source_span:skip&quot;],&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:null,&quot;section_heading&quot;:null,&quot;paragraph_id&quot;:null,&quot;sentence_id&quot;:null,&quot;paragraph_char_start&quot;:null,&quot;paragraph_char_end&quot;:null,&quot;sentence_char_start&quot;:null,&quot;sentence_char_end&quot;:null,&quot;sentence_text&quot;:&quot;Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported.&quot;,&quot;paragraph_text&quot;:&quot;Clinical Description Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental delay and intellectual disability with a broad range of abnormalities in multiple organs. The phenotypic delineation is limited, particularly with respect to potential age-related manifestations such as neurodegeneration or clinical regression; the majority of reported individuals are children and adolescents younger than age 20 years and longitudinal data remain sparse. To date, approximately 79 individuals with a pathogenic variant in SON have been documented in the literature [ Tang et al 2023 ]. However, as of May 2025, the estimated number of individuals with a SON pathogenic variant identified was 450-500 worldwide (communication with ZTTK SON-Shine Foundation ). The following description of the phenotypic features associated with this condition is based on these reports [ Kushary et al 2021 , Dingemans et al 2022 , Tang et al 2023 ]. Table 2. Zhu-Tokita-Takenouchi-Kim Syndrome: Frequency of Select Features View in own window Based on Kushary et al [2021] , Dingemans et al [2022] , and Tang et al [2023] Developmental delay and intellectual disability. Mild-to-profound developmental delay / intellectual disabilities has been reported in all individuals. Hypotonia is common. Reported delays include motor delays in rolling over, sitting up, crawling, and walking. Infants have feeding difficulties. Speech delay is common. Developmental regression has been reported in several individuals. One study reported developmental regression in three of seven individuals [ Tokita et al 2016 ]; an additional study reported developmental regression in two of 15 individuals [ Kushary et al 2021 ]. Brain malformations include ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy (often reduced volume of periventricular white matter), abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), and enlarged subarachnoid space. Neurobehavioral/psychiatric manifestations. Behavioral problems include sleep disturbances and autism spectrum disorder [ Dingemans et al 2022 ]. Seizures are common with age of onset ranging from infancy to six years [ Zhu et al 2015 , Kim et al 2016b , Tokita et al 2016 , Kushary et al 2021 ]. Complex partial and complex febrile seizures have been reported. Other seizure types described include generalized tonic-clonic seizures and focal seizures, although the seizure spectrum can vary among individuals. Status epilepticus was reported in 16% of individuals [ Kushary et al 2021 ]. Movement disorder. Dystonia and tremor have been reported, although these features have not been fully documented. Cervical dystonia and dystonic posturing of limbs have been reported in one adult with childhood onset; this worsened over time, contributing to functional impairment. The same individual had an intention tremor affecting the limbs [ Indelicato et al 2022 ]. Craniofacial features. Some combination of characteristic facial features have been reported in approximately 95% of individuals including facial asymmetry (30%), prominent forehead, horizontal eyebrows (32%), ptosis, downslanted palpebral fissures (52%), epicanthal folds (20%), deep-set eyes (27%), midface retrusion (34%), depressed or other abnormality of the nasal bridge (56%), low-set ears (53%), posteriorly rotated ears (15%), short and/or smooth philtrum (54%), thin vermilion of the upper lip (13%), bifid uvula, and high-arched palate. Craniosynostosis has been reported in six individuals (10%) [ Kim et al 2016b , Kushary et al 2021 , Halliday et al 2022 ], involving the metopic, sagittal, and coronal sutures. Skeletal manifestations. Scoliosis and kyphosis have been reported (combined estimated frequency is 6%) [ Kim et al 2016b , Tokita et al 2016 ]. Thumb agenesis, syndactyly, flat feet, small feet, short toes, rib fusion, generalized joint hypermobility, and/or contractures of large and small joints have been reported. Hyperextensibility of the interphalangeal joints of the hand and elbow joints has been described [ Kushary et al 2021 ]. Ophthalmologic involvement. More than half (58%) of the individuals who reported vision abnormalities presented with strabismus [ Kushary et al 2021 ]. Hypermetropia with childhood onset (20%) and cortical visual impairment (11%) have been reported. Growth deficiency. Intrauterine growth restriction was reported in 12/36 infants (33%) [ Dingemans et al 2022 ]. Microcephaly was reported in 11/40 examined individuals [ Dingemans et al 2022 ]. To date, it is unclear how many infants had congenital microcephaly. Weight below the third centile was reported in 14/25 individuals. Short stature (below the third centile) was reported in 26/48 individuals. It is likely that postnatal growth failure is exacerbated by feeding difficulties. Growth hormone deficiency was reported in 6/43 individuals [ Dingemans et al 2022 ] and also identified in two additional individuals [ Yang et al 2019 , Yang &amp; Yang 2020 ]. The final adult height has not been documented, as many affected individuals are currently in infancy or childhood. Genitourinary/kidney manifestations. Chordee, undescended testes, inguinal hernia, shawl scrotum, and hypoplastic labia major are reported. Kidney abnormalities include single kidney, horseshoe kidney, kidney dysplasia, and polycystic kidneys [ Kim et al 2019 ]. Hematologic findings. Thrombocytopenia and deep vein thrombosis have been reported [ Kim et al 2016b , Tokita et al 2016 , Pietrobattista et al 2023 ]. Heart abnormalities. Ventricular septal defect (VSD), atrial septal defect (ASD), and dysplastic aortic valve have been reported [ Kim et al 2016b , Tokita et al 2016 ]. Dingemans et al [2022] examined additional individuals and reported that 15/46 (33%) individuals had a heart defect, especially ASD (6/35, 17%) and VSD (4/46, 9%). Immunologic manifestations. Immunoglobulin (Ig) deficiency, particularly IgA and IgG deficiency, has been reported in 15/46 assessed individuals [ Dingemans et al 2022 ]. Reported recurrent infections include respiratory tract, urinary tract, and ear. Gastrointestinal manifestations include malrotation of the gut, gastroesophageal reflux disease, diarrhea, constipation, and gallbladder agenesis; chronic liver cirrhosis with micro- and macronodularity and spongiosis hepatitis have been reported [ Pietrobattista et al 2023 ]. Hearing impairment. Hearing loss was reported in 3/7 individuals in one report [ Halliday et al 2022 ]; hearing impairment was described as conductive in one individual. Age of onset of hearing loss is not known. The ages of these three individuals at their last examination were 17 years, four years, and five years eight months. Other. Recurrent hemiplegic migraine was reported in one individual [ Langford et al 2023 ]. Prognosis. Based on current data, life span is not limited by this condition, as several adults have been reported, including one individual alive at age 50 years [ Dingemans et al 2022 ]. However, three affected individuals died in childhood (communication with ZTTK SON-Shine Foundation ), although the exact causes of death were not documented. Considerable variability in clinical course has been observed, with preliminary reports indicating that some individuals may experience progression or regression of neurologic and behavioral features, whereas others do not. The underlying basis of this variability remains uncertain and may reflect differences in genetic background, environmental or nutritional influences, or other modifying factors rather than allelic heterogeneity alone. This represents a significant knowledge gap and underscores that a molecular diagnosis of ZTTK syndrome does not inherently imply a uniformly severe or lethal prognosis. Longitudinal studies across broader age ranges will be essential to clarify the natural history of the disorder.&quot;,&quot;matched_phrase&quot;:&quot;contractures&quot;,&quot;match_span_text&quot;:null,&quot;frequency_raw&quot;:null,&quot;onset_raw&quot;:null,&quot;progression_raw&quot;:null,&quot;treatment_response_raw&quot;:null,&quot;spans&quot;:[],&quot;failed_checks&quot;:[],&quot;flagged_checks&quot;:[],&quot;checks&quot;:[{&quot;name&quot;:&quot;source_span&quot;,&quot;status&quot;:&quot;skip&quot;,&qu or small joints, and/or generalized joint hypermobility Ophthalmologic involvement: strabismus, hypermetropia, cortical vision impairment Craniofacial features: facial asymmetry, prominent forehead, horizontal eyebrows, ptosis, downslanted palpebral fissures, epicanthal folds, deep-set eyes, depressed nasal bridge, low-set ears, short and smooth philtrum, thin vermilion of the upper lip, bifid uvula, and high-arched palate; craniosynostosis also reported (See Figures 1 , 2 , and 3 .) Poor weight gain, short stature, and microcephaly Neurobehavioral/psychiatric manifestations: sleep disturbance, autism spectrum disorder, emotional dysregulation, and aggression Epilepsy: complex partial and complex febrile seizures Movement disorder: dystonia, tremors Genitourinary and kidney manifestations: chordee, single kidney, horseshoe kidney, kidney dysplasia, polycystic kidneys, undescended testes, inguinal hernia, and shawl scrotum Thrombocytopenia and deep venous thrombosis Structural cardiac anomalies: ventricular septal defect, atrial septal defect, and dysplastic aortic valve Immunodeficiency: Immunoglobulin (Ig) A deficiency, IgG deficiency, and recurrent infection Gastrointestinal manifestations: malrotation of the gut, gastroesophageal reflux disease, diarrhea, constipation, and gallbladder agenesis Endocrinologic abnormalities: growth hormone deficiency Imaging findings Brain MRI findings. Ventriculomegaly, periventricular nodular heterotopia, subependymal gray matter heterotopia, corpus callosum dysplasia, cerebellar dysplasia, white matter hypoplasia or atrophy, abnormal cerebral gyration (polymicrogyria, smooth or underdeveloped cortex), enlarged subarachnoid space Radiographic findings. Hemivertebrae, rib fusions, delayed bone age Family history. Because ZTTK syndrome is typically caused by a de novo pathogenic variant, most probands represent a simplex case (i.e., a single occurrence in a family).&quot;,&quot;matched_phrase&quot;:&quot;respiratory tract infection },{&quot;name&quot;:&quot;table_concordance&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No matching table row found for this phenotype.&quot;},{&quot;name&quot;:&quot;section_branch_consistency&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;Section heading does not map to a supported audit branch.&quot;}]}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById('audit-payload').textContent);
    const state = { filter: 'all', currentId: null };
    const reviewList = document.getElementById('review-list');
    const chapterEl = document.getElementById('chapter');
    const detailPanel = document.getElementById('detail-panel');
    const paragraphMap = new Map();
    const sentenceMap = new Map();

    function escapeHtmlJs(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function verdictClass(verdict) {
      return String(verdict || '').toLowerCase();
    }

    function filteredItems() {
      return payload.items.filter((item) => {
        if (state.filter === 'all') return true;
        if (state.filter === 'review') return !item.auto_accept_eligible;
        if (state.filter === 'eligible') return item.auto_accept_eligible;
        if (state.filter === 'failed') return item.verdict === 'FAILED';
        if (state.filter === 'flagged') return item.verdict === 'FLAGGED';
        return true;
      });
    }

    function renderChapter() {
      chapterEl.innerHTML = payload.sections.map((section) => {
        const paragraphs = section.paragraphs.map((paragraph) => {
          const sentences = paragraph.sentences.map((sentence) =>
            '<span class="sentence" id="sentence-' + escapeHtmlJs(sentence.sentence_id) + '" data-text="' + escapeHtmlJs(sentence.text) + '" data-sentence-id="' + escapeHtmlJs(sentence.sentence_id) + '">' + escapeHtmlJs(sentence.text) + '</span>'
          ).join(' ');
          return '<div class="paragraph" id="paragraph-' + escapeHtmlJs(paragraph.paragraph_id) + '">' + sentences + '</div>';
        }).join('');
        return '<section class="section" id="' + escapeHtmlJs(section.section_id) + '"><h2>' + escapeHtmlJs(section.section_heading || 'Section') + '</h2>' + paragraphs + '</section>';
      }).join('');
      chapterEl.querySelectorAll('.paragraph').forEach((el) => paragraphMap.set(el.id.replace('paragraph-', ''), el));
      chapterEl.querySelectorAll('.sentence').forEach((el) => sentenceMap.set(el.dataset.sentenceId, el));
    }

    function renderReviewList() {
      const items = filteredItems();
      reviewList.innerHTML = items.map((item) => {
        const classes = ['review-item'];
        if (item.review_id === state.currentId) classes.push('active');
        const flags = [];
        if (item.flagged_checks.length) flags.push(item.flagged_checks.join(', '));
        if (item.failed_checks.length) flags.push(item.failed_checks.join(', '));
        return '<button class="' + classes.join(' ') + '" data-review-id="' + escapeHtmlJs(item.review_id) + '">' +
          '<div class="chips">' +
            '<span class="chip ' + verdictClass(item.verdict) + '">' + escapeHtmlJs(item.verdict) + '</span>' +
            '<span class="chip">' + escapeHtmlJs(item.status) + '</span>' +
            '<span class="chip">' + escapeHtmlJs(item.section_heading || 'No section') + '</span>' +
          '</div>' +
          '<h3>' + escapeHtmlJs(item.hpo_label || item.hpo_id) + '</h3>' +
          '<p>' + escapeHtmlJs(flags[0] || (item.auto_accept_eligible ? 'Auto-accept eligible' : 'Verifier requires review')) + '</p>' +
        '</button>';
      }).join('');
      reviewList.querySelectorAll('[data-review-id]').forEach((button) => {
        button.addEventListener('click', () => selectItem(button.dataset.reviewId));
      });
    }

    function resetHighlights() {
      for (const el of sentenceMap.values()) {
        el.classList.remove('active');
        el.innerHTML = escapeHtmlJs(el.dataset.text || '');
      }
      for (const el of paragraphMap.values()) {
        el.classList.remove('active');
      }
    }

    function buildHighlightHtml(sentenceText, sentenceStart, spans) {
      const source = String(sentenceText || '');
      const intervals = [];
      for (const span of spans) {
        const start = Number(span.char_start);
        const end = Number(span.char_end);
        if (!Number.isFinite(start) || !Number.isFinite(end)) continue;
        const localStart = start - sentenceStart;
        const localEnd = end - sentenceStart;
        if (localStart < 0 || localEnd > source.length || localEnd <= localStart) continue;
        intervals.push({ start: localStart, end: localEnd, label: span.key });
      }
      if (!intervals.length) return escapeHtmlJs(source);
      const events = [];
      for (const interval of intervals) {
        events.push({ pos: interval.start, type: 'start', label: interval.label });
        events.push({ pos: interval.end, type: 'end', label: interval.label });
      }
      events.sort((a, b) => a.pos - b.pos || (a.type === 'end' ? -1 : 1));
      let cursor = 0;
      const active = [];
      let html = '';
      for (const event of events) {
        if (event.pos > cursor) {
          const text = escapeHtmlJs(source.slice(cursor, event.pos));
          if (active.length) {
            html += '<mark class="' + active.join(' ') + '">' + text + '</mark>';
          } else {
            html += text;
          }
          cursor = event.pos;
        }
        if (event.type === 'start') {
          if (!active.includes(event.label)) active.push(event.label);
        } else {
          const index = active.indexOf(event.label);
          if (index >= 0) active.splice(index, 1);
        }
      }
      if (cursor < source.length) {
        const text = escapeHtmlJs(source.slice(cursor));
        if (active.length) {
          html += '<mark class="' + active.join(' ') + '">' + text + '</mark>';
        } else {
          html += text;
        }
      }
      return html;
    }

    function renderDetail(item) {
      const chips = [
        '<span class="chip ' + verdictClass(item.verdict) + '">' + escapeHtmlJs(item.verdict) + '</span>',
        '<span class="chip">' + escapeHtmlJs(item.status) + '</span>',
        item.auto_accept_eligible ? '<span class="chip">Auto-accept eligible</span>' : '<span class="chip">Needs review</span>'
      ].join(' ');
      const failed = item.failed_checks.length ? '<li>' + item.failed_checks.map(escapeHtmlJs).join('</li><li>') + '</li>' : '<li>None</li>';
      const flagged = item.flagged_checks.length ? '<li>' + item.flagged_checks.map(escapeHtmlJs).join('</li><li>') + '</li>' : '<li>None</li>';
      const spans = item.spans.map((span) =>
        '<li><strong>' + escapeHtmlJs(span.label) + ':</strong> ' + escapeHtmlJs(span.text || 'No stored span text') + '</li>'
      ).join('');
      detailPanel.innerHTML =
        '<h2>' + escapeHtmlJs(item.hpo_label || item.hpo_id) + '</h2>' +
        '<div class="chips">' + chips + '</div>' +
        '<p>' + escapeHtmlJs(item.section_heading || 'No section heading') + ' · ' + escapeHtmlJs(item.paragraph_id || 'no paragraph') + ' · ' + escapeHtmlJs(item.sentence_id || 'no sentence') + '</p>' +
        '<div class="detail-block"><h3>Sentence</h3><pre>' + escapeHtmlJs(item.sentence_text || '') + '</pre></div>' +
        '<div class="detail-block"><h3>Span texts</h3><ul class="detail-list">' + (spans || '<li>None</li>') + '</ul></div>' +
        '<div class="detail-block"><h3>Failed checks</h3><ul class="detail-list">' + failed + '</ul></div>' +
        '<div class="detail-block"><h3>Flagged checks</h3><ul class="detail-list">' + flagged + '</ul></div>' +
        '<div class="detail-block"><h3>Auto-accept reasons</h3><pre>' + escapeHtmlJs((item.auto_accept_reasons || []).join('\n') || 'None') + '</pre></div>' +
        '<div class="detail-block"><h3>Open source</h3><p><a class="detail-link" href="' + escapeHtmlJs(item.source_url || '#') + '" target="_blank" rel="noreferrer">NCBI chapter</a></p></div>';
    }

    function selectItem(reviewId) {
      const item = payload.items.find((entry) => entry.review_id === reviewId);
      if (!item) return;
      state.currentId = reviewId;
      window.location.hash = reviewId;
      renderReviewList();
      resetHighlights();
      const sentenceEl = sentenceMap.get(item.sentence_id);
      const paragraphEl = paragraphMap.get(item.paragraph_id);
      if (paragraphEl) paragraphEl.classList.add('active');
      if (sentenceEl) {
        sentenceEl.classList.add('active');
        sentenceEl.innerHTML = buildHighlightHtml(sentenceEl.dataset.text || '', item.sentence_char_start || 0, item.spans || []);
        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      renderDetail(item);
    }

    document.querySelectorAll('.filters button').forEach((button) => {
      button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll('.filters button').forEach((el) => el.classList.toggle('active', el === button));
        renderReviewList();
      });
    });

    renderChapter();
    renderReviewList();
    const initialId = location.hash.replace(/^#/, '') || (payload.items[0] && payload.items[0].review_id);
    if (initialId) selectItem(initialId);
  </script>
</body>
</html>
