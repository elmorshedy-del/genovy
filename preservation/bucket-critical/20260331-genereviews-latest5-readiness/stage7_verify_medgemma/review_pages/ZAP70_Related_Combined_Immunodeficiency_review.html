;char_end&quot;:3194}]},{&quot;paragraph_id&quot;:&quot;p23&quot;,&quot;paragraph_index&quot;:23,&quot;text&quot;:&quot;Although functional antibody responses to immunization are present in a few persons [ Turul et al 2009 , Hauck et al 2015 ], this finding does not indicate that all specific antigenic responses are intact.&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Suggestive_Findings&quot;,&quot;section_heading&quot;:&quot;Suggestive Findings&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p23_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Although functional antibody responses to immunization are present in a few persons [ Turul et al 2009 , Hauck et al 2015 ], this finding does not indicate that all specific antigenic responses are intact.&quot;,&quot;char_start&quot;:3196,&quot;char_end&quot;:3401}]},{&quot;paragraph_id&quot;:&quot;p24&quot;,&quot;paragraph_index&quot;:24,&quot;text&quot;:&quot;Newborn screening. The utility of TREC screening for individuals with ZAP70 -related CID continues to be controversial. Although some have shown that TREC levels in individuals with confirmed ZAP70 -related CID are very low compared to age-matched controls [ Roifman et al 2010 , Roifman et al 2012 , Aluri et al 2017 ], others have shown that a substantial portion of individuals with ZAP70 -related CID have TREC levels above the cutoffs used for newborn screening and could be missed [ Grazioli et al 2014 , Jilkina et al 2014 , Hauck et al 2015 , Schroeder et al 2016 ]. Therefore, newborn screening results must be interpreted with caution in individuals with clinical findings consistent with ZAP70 -related CID or in populations with a high prevalence of ZAP70 -related CID.&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Suggestive_Findings&quot;,&quot;section_heading&quot;:&quot;Suggestive Findings&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p24_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Newborn screening.&quot;,&quot;char_start&quot;:3403,&quot;char_end&quot;:3421},{&quot;sentence_id&quot;:&quot;p24_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;The utility of TREC screening for individuals with ZAP70 -related CID continues to be controversial.&quot;,&quot;char_start&quot;:3422,&quot;char_end&quot;:3522},{&quot;sentence_id&quot;:&quot;p24_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Although some have shown that TREC levels in individuals with confirmed ZAP70 -related CID are very low compared to age-matched controls [ Roifman et al 2010 , Roifman et al 2012 , Aluri et al 2017 ], others have shown that a substantial portion of individuals with ZAP70 -related CID have TREC levels above the cutoffs used for newborn screening and could be missed [ Grazioli et al 2014 , Jilkina et al 2014 , Hauck et al 2015 , Schroeder et al 2016 ].&quot;,&quot;char_start&quot;:3523,&quot;char_end&quot;:3977},{&quot;sentence_id&quot;:&quot;p24_s4&quot;,&quot;sentence_index&quot;:4,&quot;text&quot;:&quot;Therefore, newborn screening results must be interpreted with caution in individuals with clinical findings consistent with ZAP70 -related CID or in populations with a high prevalence of ZAP70 -related CID.&quot;,&quot;char_start&quot;:3978,&quot;char_end&quot;:4184}]}]},{&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;paragraphs&quot;:[{&quot;paragraph_id&quot;:&quot;p25&quot;,&quot;paragraph_index&quot;:25,&quot;text&quot;:&quot;Individuals with ZAP70 -related CID characteristically present in the first two years of life with recurrent bacterial, viral (including live-virus vaccine strains), and opportunistic infections, diarrhea, and failure to thrive. Severe lower-respiratory infections are seen, most notably Pneumocystis jiroveci infections and viral infections. Oral candidiasis is also common [ Cuvelier et al 2016 , Schroeder et al 2016 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p25_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Individuals with ZAP70 -related CID characteristically present in the first two years of life with recurrent bacterial, viral (including live-virus vaccine strains), and opportunistic infections, diarrhea, and failure to thrive.&quot;,&quot;char_start&quot;:4186,&quot;char_end&quot;:4414},{&quot;sentence_id&quot;:&quot;p25_s2&quot;,&quot;sentence_index&quot;:2,&quot;text&quot;:&quot;Severe lower-respiratory infections are seen, most notably Pneumocystis jiroveci infections and viral infections.&quot;,&quot;char_start&quot;:4415,&quot;char_end&quot;:4528},{&quot;sentence_id&quot;:&quot;p25_s3&quot;,&quot;sentence_index&quot;:3,&quot;text&quot;:&quot;Oral candidiasis is also common [ Cuvelier et al 2016 , Schroeder et al 2016 ].&quot;,&quot;char_start&quot;:4529,&quot;char_end&quot;:4608}]},{&quot;paragraph_id&quot;:&quot;p26&quot;,&quot;paragraph_index&quot;:26,&quot;text&quot;:&quot;Other presentations have also been reported:&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p26_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Other presentations have also been reported:&quot;,&quot;char_start&quot;:4610,&quot;char_end&quot;:4654}]},{&quot;paragraph_id&quot;:&quot;p27&quot;,&quot;paragraph_index&quot;:27,&quot;text&quot;:&quot;Reports of milder phenotypes in sibs of children who had died from ZAP70 -related CID include a child age five months with recurrent lower-respiratory disease but no severe infections [ Turul et al 2009 ] and a child with persistent dermatitis resistant to therapy [ Katamura et al 1999 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p27_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;Reports of milder phenotypes in sibs of children who had died from ZAP70 -related CID include a child age five months with recurrent lower-respiratory disease but no severe infections [ Turul et al 2009 ] and a child with persistent dermatitis resistant to therapy [ Katamura et al 1999 ].&quot;,&quot;char_start&quot;:4656,&quot;char_end&quot;:4945}]},{&quot;paragraph_id&quot;:&quot;p28&quot;,&quot;paragraph_index&quot;:28,&quot;text&quot;:&quot;A child age nine years with a ZAP70 hypomorphic intronic pathogenic variant had an attenuated clinical and immunologic phenotype [ Picard et al 2009 ] (see Genotype-Phenotype Correlations ).&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p28_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;A child age nine years with a ZAP70 hypomorphic intronic pathogenic variant had an attenuated clinical and immunologic phenotype [ Picard et al 2009 ] (see Genotype-Phenotype Correlations ).&quot;,&quot;char_start&quot;:4947,&quot;char_end&quot;:5137}]},{&quot;paragraph_id&quot;:&quot;p29&quot;,&quot;paragraph_index&quot;:29,&quot;text&quot;:&quot;A child age 11 months with ZAP70 -related CID presented with lymphoma [ Newell et al 2011 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p29_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;A child age 11 months with ZAP70 -related CID presented with lymphoma [ Newell et al 2011 ].&quot;,&quot;char_start&quot;:5139,&quot;char_end&quot;:5231}]},{&quot;paragraph_id&quot;:&quot;p30&quot;,&quot;paragraph_index&quot;:30,&quot;text&quot;:&quot;BCG-related complications including axillary lymphadenitis or disseminated mycobacterial disease following BCG vaccination may be presenting features [ Santos et al 2010 , Esenboga et al 2016 ].&quot;,&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p30_s1&quot;,&quot;sentence_index&quot;:1,&quot;text&quot;:&quot;BCG-related complications including axillary lymphadenitis or disseminated mycobacterial disease following BCG vaccination may be presenting features [ Santos et al 2010 , Esenboga et al 2016 ].&quot;,&quot;char_start&quot;:5233,&quot;char_end&quot;:5427}]},{&quot;paragraph_id&quot;:&quot;p31&quot;,&quot;paragraph_index&quot;:31,&quot;text&quot;:&quot;Two individuals presented with recurrent infections and silent brain infarcts; one also had congenital nephrotic syndrome and autoimmune hemolytic anemia [ Akar et al 2015 ].&quot;,&quot;local_clinical_domains&quot;:[{&quot;key&quot;:&quot;neurologic&quot;,&quot;label&quot;:&quot;Neurologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;recurrent infections and silent brain infarcts; one also had congenital nephrotic syn&quot;]},{&quot;key&quot;:&quot;hematologic_immunologic&quot;,&quot;label&quot;:&quot;Hematologic / Immunologic&quot;,&quot;evidence_headings&quot;:[],&quot;evidence_snippets&quot;:[&quot;ndrome and autoimmune hemolytic anemia [ Akar et al 2015 ].&quot;]}],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;sentences&quot;:[{&quot;sentence_id&quot;:&quot;p31_s1&quot;,&quot;sentence_inde TP) has been described [ Cuvelier et al 2016 ].&quot;},{&quot;name&quot;:&quot;phenotype_presence&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Matched \&quot;thrombocytopenia\&quot; at recorded span.&quot;,&quot;matched_phrase&quot;:&quot;thrombocytopenia&quot;,&quot;evidence_source&quot;:&quot;span&quot;,&quot;match_span_text&quot;:&quot;thrombocytopenia&quot;},{&quot;name&quot;:&quot;frequency_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No frequency claimed.&quot;},{&quot;name&quot;:&quot;onset_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset claimed.&quot;},{&quot;name&quot;:&quot;progression_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No progression claimed.&quot;},{&quot;name&quot;:&quot;treatment_response_support&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Treatment response verified at recorded span as \&quot;treatment-refractory\&quot;.&quot;,&quot;span_text&quot;:&quot;treatment-refractory&quot;},{&quot;name&quot;:&quot;clause_attachment&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset attachment to verify.&quot;},{&quot;name&quot;:&quot;alias_shadow&quot;,&quot;status&quot;:&quot;flag&quot;,&quot;detail&quot;:&quot;Potential alias-shadow overlap inside \&quot;isolated treatment-refractory immune thrombocytopenia\&quot;.&quot;,&quot;enclosing_phrase&quot;:&quot;isolated treatment-refractory immune thrombocytopenia&quot;},{&quot;name&quot;:&quot;disease_subtype_leak&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No onset claimed.&quot;},{&quot;name&quot;:&quot;excluded_status&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;Feature is present, not excluded.&quot;},{&quot;name&quot;:&quot;table_concordance&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No parsed GeneReviews tables available.&quot;},{&quot;name&quot;:&quot;section_branch_consistency&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;Section heading does not map to a supported audit branch.&quot;}]},{&quot;review_id&quot;:&quot;review-41-hp-0020071-present&quot;,&quot;review_href&quot;:&quot;/Users/ahmedelmorshedy/Genovy-phenotype-enrichment-20260316-0914/output/genereviews-pipeline-latest5-settled-20260330/stage7_verify_medgemma/review_pages/ZAP70_Related_Combined_Immunodeficiency_review.html#review-41-hp-0020071-present&quot;,&quot;hosted_review_href&quot;:&quot;/audit/genereviews?chapter=zap70_related_combined_immunodeficiency#review-41-hp-0020071-present&quot;,&quot;chapter_key&quot;:&quot;zap70_related_combined_immunodeficiency&quot;,&quot;nbk_id&quot;:&quot;NBK20221&quot;,&quot;chapter_title&quot;:&quot;ZAP70-Related Combined Immunodeficiency - GeneReviews® - NCBI Bookshelf&quot;,&quot;source_url&quot;:&quot;https://www.ncbi.nlm.nih.gov/books/NBK20221/&quot;,&quot;hpo_id&quot;:&quot;HP:0020071&quot;,&quot;hpo_label&quot;:&quot;Viremia&quot;,&quot;status&quot;:&quot;present&quot;,&quot;verdict&quot;:&quot;FLAGGED&quot;,&quot;auto_accept_eligible&quot;:false,&quot;auto_accept_reasons&quot;:[&quot;alias_shadow:flag&quot;],&quot;local_clinical_domains&quot;:[],&quot;section_id&quot;:&quot;section_Clinical_Description&quot;,&quot;section_heading&quot;:&quot;Clinical Description&quot;,&quot;paragraph_id&quot;:&quot;p34&quot;,&quot;sentence_id&quot;:&quot;p34_s1&quot;,&quot;paragraph_char_start&quot;:5990,&quot;paragraph_char_end&quot;:6476,&quot;sentence_char_start&quot;:5990,&quot;sentence_char_end&quot;:6298,&quot;sentence_text&quot;:&quot;An adult with a history of infantile-onset colitis, recurrent respiratory-tract infections, mucocutaneous candidiasis, HSV stomatitis, VZV infection, EBV lymphoproliferative disorder, recurrent CMV viremia, polyomaviremia, and epidermodysplasia verruciformis-like lesions due to HHV-23 was recently reported.&quot;,&quot;paragraph_text&quot;:&quot;An adult with a history of infantile-onset colitis, recurrent respiratory-tract infections, mucocutaneous candidiasis, HSV stomatitis, VZV infection, EBV lymphoproliferative disorder, recurrent CMV viremia, polyomaviremia, and epidermodysplasia verruciformis-like lesions due to HHV-23 was recently reported. A novel pathogenic variant ( c.1065C&gt;T ) that leads to an altered splice site and low levels of wild-type ZAP-70 protein was identified in this individual [ Gavino et al 2017 ].&quot;,&quot;matched_phrase&quot;:&quot;viremia&quot;,&quot;match_span_text&quot;:&quot;viremia&quot;,&quot;frequency_raw&quot;:null,&quot;onset_raw&quot;:&quot;infantile-onset&quot;,&quot;progression_raw&quot;:null,&quot;treatment_response_raw&quot;:null,&quot;spans&quot;:[{&quot;key&quot;:&quot;phenotype&quot;,&quot;label&quot;:&quot;Phenotype&quot;,&quot;char_start&quot;:6188,&quot;char_end&quot;:6195,&quot;text&quot;:&quot;viremia&quot;},{&quot;key&quot;:&quot;onset&quot;,&quot;label&quot;:&quot;Onset&quot;,&quot;char_start&quot;:6017,&quot;char_end&quot;:6032,&quot;text&quot;:&quot;infantile-onset&quot;}],&quot;failed_checks&quot;:[],&quot;flagged_checks&quot;:[&quot;alias_shadow&quot;],&quot;checks&quot;:[{&quot;name&quot;:&quot;source_span&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Sentence span resolves inside cached chapter text.&quot;,&quot;span_text&quot;:&quot;An adult with a history of infantile-onset colitis, recurrent respiratory-tract infections, mucocutaneous candidiasis, HSV stomatitis, VZV infection, EBV lymphoproliferative disorder, recurrent CMV viremia, polyomaviremia, and epidermodysplasia verruciformis-like lesions due to HHV-23 was recently reported.&quot;},{&quot;name&quot;:&quot;phenotype_presence&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Matched \&quot;viremia\&quot; at recorded span.&quot;,&quot;matched_phrase&quot;:&quot;viremia&quot;,&quot;evidence_source&quot;:&quot;span&quot;,&quot;match_span_text&quot;:&quot;viremia&quot;},{&quot;name&quot;:&quot;frequency_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No frequency claimed.&quot;},{&quot;name&quot;:&quot;onset_support&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Onset verified at recorded span as \&quot;infantile-onset\&quot;.&quot;,&quot;span_text&quot;:&quot;infantile-onset&quot;},{&quot;name&quot;:&quot;progression_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No progression claimed.&quot;},{&quot;name&quot;:&quot;treatment_response_support&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No treatment response claimed.&quot;},{&quot;name&quot;:&quot;clause_attachment&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;Phenotype and onset occur in the same clause window.&quot;},{&quot;name&quot;:&quot;alias_shadow&quot;,&quot;status&quot;:&quot;flag&quot;,&quot;detail&quot;:&quot;Potential alias-shadow overlap inside \&quot;recurrent CMV viremia\&quot;.&quot;,&quot;enclosing_phrase&quot;:&quot;recurrent CMV viremia&quot;},{&quot;name&quot;:&quot;disease_subtype_leak&quot;,&quot;status&quot;:&quot;pass&quot;,&quot;detail&quot;:&quot;No disease-subtype leakage pattern detected.&quot;},{&quot;name&quot;:&quot;excluded_status&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;Feature is present, not excluded.&quot;},{&quot;name&quot;:&quot;table_concordance&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;No parsed GeneReviews tables available.&quot;},{&quot;name&quot;:&quot;section_branch_consistency&quot;,&quot;status&quot;:&quot;skip&quot;,&quot;detail&quot;:&quot;Section heading does not map to a supported audit branch.&quot;}]}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById('audit-payload').textContent);
    const state = { filter: 'all', currentId: null };
    const reviewList = document.getElementById('review-list');
    const chapterEl = document.getElementById('chapter');
    const detailPanel = document.getElementById('detail-panel');
    const paragraphMap = new Map();
    const sentenceMap = new Map();

    function escapeHtmlJs(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function verdictClass(verdict) {
      return String(verdict || '').toLowerCase();
    }

    function filteredItems() {
      return payload.items.filter((item) => {
        if (state.filter === 'all') return true;
        if (state.filter === 'review') return !item.auto_accept_eligible;
        if (state.filter === 'eligible') return item.auto_accept_eligible;
        if (state.filter === 'failed') return item.verdict === 'FAILED';
        if (state.filter === 'flagged') return item.verdict === 'FLAGGED';
        return true;
      });
    }

    function renderChapter() {
      chapterEl.innerHTML = payload.sections.map((section) => {
        const paragraphs = section.paragraphs.map((paragraph) => {
          const sentences = paragraph.sentences.map((sentence) =>
            '<span class="sentence" id="sentence-' + escapeHtmlJs(sentence.sentence_id) + '" data-text="' + escapeHtmlJs(sentence.text) + '" data-sentence-id="' + escapeHtmlJs(sentence.sentence_id) + '">' + escapeHtmlJs(sentence.text) + '</span>'
          ).join(' ');
          return '<div class="paragraph" id="paragraph-' + escapeHtmlJs(paragraph.paragraph_id) + '">' + sentences + '</div>';
        }).join('');
        return '<section class="section" id="' + escapeHtmlJs(section.section_id) + '"><h2>' + escapeHtmlJs(section.section_heading || 'Section') + '</h2>' + paragraphs + '</section>';
      }).join('');
      chapterEl.querySelectorAll('.paragraph').forEach((el) => paragraphMap.set(el.id.replace('paragraph-', ''), el));
      chapterEl.querySelectorAll('.sentence').forEach((el) => sentenceMap.set(el.dataset.sentenceId, el));
    }

    function renderReviewList() {
      const items = filteredItems();
      reviewList.innerHTML = items.map((item) => {
        const classes = ['review-item'];
        if (item.review_id === state.currentId) classes.push('active');
        const flags = [];
        if (item.flagged_checks.length) flags.push(item.flagged_checks.join(', '));
        if (item.failed_checks.length) flags.push(item.failed_checks.join(', '));
        return '<button class="' + classes.join(' ') + '" data-review-id="' + escapeHtmlJs(item.review_id) + '">' +
          '<div class="chips">' +
            '<span class="chip ' + verdictClass(item.verdict) + '">' + escapeHtmlJs(item.verdict) + '</span>' +
            '<span class="chip">' + escapeHtmlJs(item.status) + '</span>' +
            '<span class="chip">' + escapeHtmlJs(item.section_heading || 'No section') + '</span>' +
          '</div>' +
          '<h3>' + escapeHtmlJs(item.hpo_label || item.hpo_id) + '</h3>' +
          '<p>' + escapeHtmlJs(flags[0] || (item.auto_accept_eligible ? 'Auto-accept eligible' : 'Verifier requires review')) + '</p>' +
        '</button>';
      }).join('');
      reviewList.querySelectorAll('[data-review-id]').forEach((button) => {
        button.addEventListener('click', () => selectItem(button.dataset.reviewId));
      });
    }

    function resetHighlights() {
      for (const el of sentenceMap.values()) {
        el.classList.remove('active');
        el.innerHTML = escapeHtmlJs(el.dataset.text || '');
      }
      for (const el of paragraphMap.values()) {
        el.classList.remove('active');
      }
    }

    function buildHighlightHtml(sentenceText, sentenceStart, spans) {
      const source = String(sentenceText || '');
      const intervals = [];
      for (const span of spans) {
        const start = Number(span.char_start);
        const end = Number(span.char_end);
        if (!Number.isFinite(start) || !Number.isFinite(end)) continue;
        const localStart = start - sentenceStart;
        const localEnd = end - sentenceStart;
        if (localStart < 0 || localEnd > source.length || localEnd <= localStart) continue;
        intervals.push({ start: localStart, end: localEnd, label: span.key });
      }
      if (!intervals.length) return escapeHtmlJs(source);
      const events = [];
      for (const interval of intervals) {
        events.push({ pos: interval.start, type: 'start', label: interval.label });
        events.push({ pos: interval.end, type: 'end', label: interval.label });
      }
      events.sort((a, b) => a.pos - b.pos || (a.type === 'end' ? -1 : 1));
      let cursor = 0;
      const active = [];
      let html = '';
      for (const event of events) {
        if (event.pos > cursor) {
          const text = escapeHtmlJs(source.slice(cursor, event.pos));
          if (active.length) {
            html += '<mark class="' + active.join(' ') + '">' + text + '</mark>';
          } else {
            html += text;
          }
          cursor = event.pos;
        }
        if (event.type === 'start') {
          if (!active.includes(event.label)) active.push(event.label);
        } else {
          const index = active.indexOf(event.label);
          if (index >= 0) active.splice(index, 1);
        }
      }
      if (cursor < source.length) {
        const text = escapeHtmlJs(source.slice(cursor));
        if (active.length) {
          html += '<mark class="' + active.join(' ') + '">' + text + '</mark>';
        } else {
          html += text;
        }
      }
      return html;
    }

    function renderDetail(item) {
      const chips = [
        '<span class="chip ' + verdictClass(item.verdict) + '">' + escapeHtmlJs(item.verdict) + '</span>',
        '<span class="chip">' + escapeHtmlJs(item.status) + '</span>',
        item.auto_accept_eligible ? '<span class="chip">Auto-accept eligible</span>' : '<span class="chip">Needs review</span>'
      ].join(' ');
      const failed = item.failed_checks.length ? '<li>' + item.failed_checks.map(escapeHtmlJs).join('</li><li>') + '</li>' : '<li>None</li>';
      const flagged = item.flagged_checks.length ? '<li>' + item.flagged_checks.map(escapeHtmlJs).join('</li><li>') + '</li>' : '<li>None</li>';
      const spans = item.spans.map((span) =>
        '<li><strong>' + escapeHtmlJs(span.label) + ':</strong> ' + escapeHtmlJs(span.text || 'No stored span text') + '</li>'
      ).join('');
      detailPanel.innerHTML =
        '<h2>' + escapeHtmlJs(item.hpo_label || item.hpo_id) + '</h2>' +
        '<div class="chips">' + chips + '</div>' +
        '<p>' + escapeHtmlJs(item.section_heading || 'No section heading') + ' · ' + escapeHtmlJs(item.paragraph_id || 'no paragraph') + ' · ' + escapeHtmlJs(item.sentence_id || 'no sentence') + '</p>' +
        '<div class="detail-block"><h3>Sentence</h3><pre>' + escapeHtmlJs(item.sentence_text || '') + '</pre></div>' +
        '<div class="detail-block"><h3>Span texts</h3><ul class="detail-list">' + (spans || '<li>None</li>') + '</ul></div>' +
        '<div class="detail-block"><h3>Failed checks</h3><ul class="detail-list">' + failed + '</ul></div>' +
        '<div class="detail-block"><h3>Flagged checks</h3><ul class="detail-list">' + flagged + '</ul></div>' +
        '<div class="detail-block"><h3>Auto-accept reasons</h3><pre>' + escapeHtmlJs((item.auto_accept_reasons || []).join('\n') || 'None') + '</pre></div>' +
        '<div class="detail-block"><h3>Open source</h3><p><a class="detail-link" href="' + escapeHtmlJs(item.source_url || '#') + '" target="_blank" rel="noreferrer">NCBI chapter</a></p></div>';
    }

    function selectItem(reviewId) {
      const item = payload.items.find((entry) => entry.review_id === reviewId);
      if (!item) return;
      state.currentId = reviewId;
      window.location.hash = reviewId;
      renderReviewList();
      resetHighlights();
      const sentenceEl = sentenceMap.get(item.sentence_id);
      const paragraphEl = paragraphMap.get(item.paragraph_id);
      if (paragraphEl) paragraphEl.classList.add('active');
      if (sentenceEl) {
        sentenceEl.classList.add('active');
        sentenceEl.innerHTML = buildHighlightHtml(sentenceEl.dataset.text || '', item.sentence_char_start || 0, item.spans || []);
        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      renderDetail(item);
    }

    document.querySelectorAll('.filters button').forEach((button) => {
      button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll('.filters button').forEach((el) => el.classList.toggle('active', el === button));
        renderReviewList();
      });
    });

    renderChapter();
    renderReviewList();
    const initialId = location.hash.replace(/^#/, '') || (payload.items[0] && payload.items[0].review_id);
    if (initialId) selectItem(initialId);
  </script>
</body>
</html>
